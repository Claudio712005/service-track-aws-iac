components:

  securitySchemes:

    ApiKeyAuth:
      type: apiKey
      name: x-api-key
      in: header

    bearerAuth: ${bearer_auth_scheme}

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenOrcamento:
      name: token
      in: query
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
    ResumoOrdemServico:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResumoOrdemServicoResponse'
    Html:
      description: Pagina HTML de resultado
      content:
        text/html:
          schema:
            type: string

  schemas:

    ErroResponse:
      type: object
      properties:
        mensagem:
          type: string
        detalhe:
          type: string

    StatusOrdemServico:
      type: string
      enum:
      - RECEBIDA
      - EM_DIAGNOSTICO
      - AGUARDANDO_APROVACAO
      - EM_EXECUCAO
      - FINALIZADA
      - ENTREGUE
      - CANCELADA

    NivelMecanico:
      type: string
      enum:
      - JUNIOR
      - PLENO
      - SENIOR

    CadastrarClienteRequest:
      type: object
      required:
      - nome
      - email
      - senha
      - dataNascimento
      - telefone
      - cpf
      properties:
        nome:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
        dataNascimento:
          type: string
          format: date
        telefone:
          type: string
          minLength: 10
          maxLength: 11
        cpf:
          type: string
          minLength: 11
          maxLength: 14

    AtualizarClienteRequest:
      type: object
      required:
      - nome
      - email
      - telefone
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string

    ClienteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
        cpf:
          type: string
        telefone:
          type: string
        roles:
          type: array
          items:
            type: string
        ativo:
          type: boolean

    CadastrarMecanicoRequest:
      type: object
      required:
      - nome
      - email
      - senha
      - dataNascimento
      - telefone
      - cpf
      - nivel
      - valorHora
      properties:
        nome:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
        dataNascimento:
          type: string
          format: date
        telefone:
          type: string
          minLength: 10
          maxLength: 11
        cpf:
          type: string
          minLength: 11
          maxLength: 14
        nivel:
          $ref: '#/components/schemas/NivelMecanico'
        valorHora:
          type: number
          format: double
          minimum: 0.01

    AtualizarMecanicoRequest:
      type: object
      required:
      - nivel
      - valorHora
      properties:
        nivel:
          $ref: '#/components/schemas/NivelMecanico'
        valorHora:
          type: number
          format: double
          minimum: 0.01

    MecanicoResponse:
      type: object
      properties:
