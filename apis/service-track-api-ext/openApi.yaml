openapi: 3.0.3

info:
  title: ServiceTrack API
  version: 1.0.0

servers:
- url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
  description: Endpoint regional do API Gateway. Os valores reais saem dos outputs
    do Terraform (api_gateway_url) e mudam a cada recriacao do ambiente.
  variables:
    apiId:
      default: apiid
      description: ID gerado pelo API Gateway (output api_gateway_id).
    region:
      default: us-east-1
    stage:
      default: hml
      enum:
      - hml
      - prd
- url: https://{domain}/{basePath}
  description: Endpoint por dominio customizado, quando habilitado (var.custom_domain).
    Estavel entre recriacoes do ambiente, ao contrario do endpoint de execute-api.
  variables:
    domain:
      default: api.servicetrack.com.br
    basePath:
      default: service-track/v1

security:
- ApiKeyAuth: []

x-amazon-apigateway-api-key-source: HEADER

x-amazon-apigateway-request-validators:
  full:
    validateRequestBody: true
    validateRequestParameters: true

x-amazon-apigateway-request-validator: full

paths:
  /autenticacao:
    post:
      operationId: login
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '500': { $ref: '#/components/responses/Erro' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: ${auth_lambda_uri}
        passthroughBehavior: when_no_match
    options: ${cors_options}

  /autenticacao/reset-senha:
