openapi: 3.0.3

info:
  title: ServiceTrack API
  version: 1.0.0

servers:
- url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
  description: Endpoint regional do API Gateway. Os valores reais saem dos outputs
    do Terraform (api_gateway_url) e mudam a cada recriacao do ambiente.
  variables:
    apiId:
      default: apiid
      description: ID gerado pelo API Gateway (output api_gateway_id).
    region:
      default: us-east-1
    stage:
      default: hml
      enum:
      - hml
      - prd
x-amazon-apigateway-api-key-source: HEADER

x-amazon-apigateway-request-validators:
  full:
    validateRequestBody: true
    validateRequestParameters: true

x-amazon-apigateway-request-validator: full

paths:
  /autenticacao:
    post:
      operationId: login
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '500': { $ref: '#/components/responses/Erro' }
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: ${auth_lambda_uri}
        passthroughBehavior: when_no_match
    options: ${cors_options}
${bff_paths}
components:

  securitySchemes:

    ApiKeyAuth:
      type: apiKey
      name: x-api-key
      in: header

    bearerAuth: ${bearer_auth_scheme}

  responses:
    Erro:
      description: Erro
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'

  schemas:

    ErroResponse:
      type: object
      properties:
        mensagem:
          type: string
        detalhe:
          type: string

    LoginRequest:
      type: object
      required:
      - cpf
      - senha
      properties:
        cpf:
          type: string
          description: CPF do cliente, com ou sem pontuacao. O digito verificador e validado.
          pattern: '^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$'
          example: '529.982.247-25'
        senha:
          type: string
          format: password
          minLength: 8

    LoginResponse:
      type: object
      description: |
        A identidade do usuario viaja no proprio JWT: `sub` traz o usuarioId,
        `groups` traz as roles e a claim `cpf` traz o CPF autenticado.
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEmSegundos:
          type: integer
          format: int64
          example: 3600
