global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: compose

scrape_configs:

  - job_name: catalogo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalogo:8080"]
        labels:
          servico: service-track-catalogo

  - job_name: usuarios-veiculos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["usuarios-veiculos:8080"]
        labels:
          servico: service-track-usuarios-veiculos

  - job_name: ordens
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ordens:8080"]
        labels:
          servico: service-track-ordens

  - job_name: checkout
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["checkout:8080"]
        labels:
          servico: service-track-checkout

  - job_name: bff
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["bff:8080"]
        labels:
          servico: service-track-bff

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
