apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __REPO__-__ENV__
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: service-track
  source:
    repoURL: https://github.com/__OWNER__/__REPO__.git
    targetRevision: main
    path: k8s/overlays/__ENV__
  destination:
    server: https://kubernetes.default.svc
    namespace: __REPO__
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
