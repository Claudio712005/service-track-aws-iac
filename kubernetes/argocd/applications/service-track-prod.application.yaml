apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-track-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: service-track
  source:
    # Os manifests foram movidos do repo da API para o repo de IaC.
    repoURL: https://github.com/Claudio712005/service-track-aws-iac.git
    targetRevision: main
    path: kubernetes/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: service-track
  ignoreDifferences:
    # O HPA governa o numero de replicas; ignorar evita luta entre Argo e HPA.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
