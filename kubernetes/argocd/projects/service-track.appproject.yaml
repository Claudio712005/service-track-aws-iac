apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: service-track
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: ServiceTrack - microsservicos e infraestrutura GitOps
  sourceRepos:
    - https://github.com/Claudio712005/*
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "service-track-*"
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: Pod
    - group: ""
      kind: Endpoints
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: discovery.k8s.io
      kind: EndpointSlice
    - group: argoproj.io
      kind: Application
  orphanedResources:
    warn: true
