apiVersion: v1
kind: Service
metadata:
  name: service-track-app-nodeport
  labels:
    app: service-track-app
# Porta de entrada do trafego externo: API Gateway -> VPC Link -> NLB interno
# -> este NodePort -> pods. O nodePort casa com var.app_node_port (30080) do
# modulo vpc-link no Terraform. Nao ha LoadBalancer publico: a unica porta de
# entrada e o API Gateway, para que API key e throttling nao sejam contornados.
spec:
  type: NodePort
  selector:
    app: service-track-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
