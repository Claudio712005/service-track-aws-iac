apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: service-track

resources:
- ../../base
- service-nodeport.yaml

components:
- ../../components/db-init

images:
- name: servicetrack-api
  newName: 821146464895.dkr.ecr.us-east-1.amazonaws.com/servicetrack-hml-app
  newTag: 28a194ebfd99f467f05ec38429d2d4969fca6302

configMapGenerator:
- literals:
  - QUARKUS_PROFILE=prod
  - OTEL_ENVIRONMENT=hml
  - QUARKUS_MAILER_FROM=no-reply@clausilva.com.br
  - MP_JWT_VERIFY_PUBLICKEY_LOCATION=file:/keys/publicKey.pem
  - SMALLRYE_JWT_SIGN_KEY_LOCATION=file:/keys/privateKey.pem
  name: service-track-config

generatorOptions:
  disableNameSuffixHash: true
