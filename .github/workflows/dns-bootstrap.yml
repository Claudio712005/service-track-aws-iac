name: DNS (zona persistente)

run-name: "DNS ${{ inputs.action }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply cria a zona (idempotente); show apenas le o estado"
        required: true
        type: choice
        default: show
        options:
          - show
          - apply
      registered_domain:
        description: "Dominio registrado no Registro.br"
        required: true
        type: string
        default: clausilva.com.br
      subdomain:
        description: "Label delegado ao Route53"
        required: true
        type: string
        default: api

permissions:
  contents: read

concurrency:
  group: dns-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: iac/bootstrap/dns

jobs:
  dns:
    name: "Zona ${{ inputs.subdomain }}.${{ inputs.registered_domain }}"
    runs-on: ubuntu-latest
    environment:
      name: prd
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform -chdir=$WORKDIR init

      - name: terraform apply
        if: inputs.action == 'apply'
        run: |
          terraform -chdir=$WORKDIR apply -no-color -auto-approve \
            -var="registered_domain=${{ inputs.registered_domain }}" \
            -var="subdomain=${{ inputs.subdomain }}"

      - name: Instalar dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Ler zona e checar delegacao
        id: zone
        run: |
          ZONE="$(terraform -chdir=$WORKDIR output -raw zone_name 2>/dev/null | sed 's/\.$//' || echo '')"
          if [ -z "$ZONE" ]; then
            echo "zone_name vazio. Rode com action=apply para criar a zona." >&2
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NS="$(terraform -chdir=$WORKDIR output -json name_servers | jq -r '.[]')"
          {
            echo "exists=true"
            echo "zone=$ZONE"
            echo "ns<<EOF"; echo "$NS"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if QUIET=true bash scripts/dns-delegation-check.sh "$ZONE" $NS; then
            echo "delegated=true" >> "$GITHUB_OUTPUT"
          else
            echo "delegated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Zona DNS persistente"
            echo ""
            if [ "${{ steps.zone.outputs.exists }}" != "true" ]; then
              echo "Zona ainda nao existe. Execute esta esteira com \`action: apply\`."
              exit 0
            fi

            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Zona | \`${{ steps.zone.outputs.zone }}\` |"
            echo "| Delegada no Registro.br | ${{ steps.zone.outputs.delegated == 'true' && 'sim' || 'NAO' }} |"
            echo ""

            if [ "${{ steps.zone.outputs.delegated }}" = "true" ]; then
              echo "### Delegacao ativa"
              echo ""
              echo "Nada a fazer no Registro.br. PRD ja pode publicar no dominio:"
              echo "execute a esteira **DNS (publicar dominio em PRD)**."
            else
              echo "### Acao manual necessaria no Registro.br"
              echo ""
              echo "Nao ha API publica do Registro.br para isso, entao este passo"
              echo "e feito uma unica vez pelo painel."
              echo ""
              echo "1. Acesse **registro.br > Painel > ${{ inputs.registered_domain }} > DNS**"
              echo "2. Use o **modo avancado** e adicione uma entrada por linha abaixo"
              echo "   (o painel ja completa o sufixo \`.${{ inputs.registered_domain }}\`):"
              echo ""
              echo "| TIPO | NOME | DADOS |"
              echo "|---|---|---|"
              while read -r ns; do
                [ -n "$ns" ] && echo "| NS | \`${{ inputs.subdomain }}\` | \`$ns\` |"
              done <<< "${{ steps.zone.outputs.ns }}"
              echo ""
              echo "3. **SALVAR ALTERACOES** e aguardar a propagacao (minutos a horas)."
              echo "4. Confirme:"
              echo ""
              echo '   ```'
              echo "   dig +short NS ${{ steps.zone.outputs.zone }}"
              echo '   ```'
              echo ""
              echo "5. Rode a esteira **DNS (publicar dominio em PRD)**."
              echo ""
              echo "> Nao delegue o apice \`${{ inputs.registered_domain }}\`: os registros"
              echo "> MX/SPF/DKIM de e-mail ficam no Registro.br e parariam de responder."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
