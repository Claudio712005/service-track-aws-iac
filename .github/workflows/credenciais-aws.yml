name: Credenciais AWS

run-name: "Propagar credenciais AWS por @${{ github.actor }}"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credenciais-aws
  cancel-in-progress: false

jobs:
  propagar:
    name: Replica as credenciais na plataforma e nos microsservicos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PLATAFORMA: >-
        service-track-aws-iac
        service-track-db-infra
        service-track-lambda
    steps:
      - name: Conferir a origem
        run: |
          : "${{ secrets.OPS_TOKEN }}"
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v vazia neste repositorio. Defina as tres em"
              echo "::error::Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            fi
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Validar as credenciais antes de espalhar
        id: conta
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: us-east-1
        run: |
          if ! CONTA="$(aws sts get-caller-identity --query Account --output text 2>&1)"; then
            echo "::error::As credenciais nao autenticam. Renove no laboratorio antes de propagar."
            echo "$CONTA"
            exit 1
          fi
          echo "conta=$CONTA" >> "$GITHUB_OUTPUT"
          echo "autenticado na conta $CONTA"

      - name: Descobrir os repositorios de destino
        id: destinos
        run: |
          set -o pipefail
          DESTINOS="$PLATAFORMA"
          for repo in $(gh api --paginate "users/$OWNER/repos?per_page=100" --jq '.[].name'); do
            case " $DESTINOS " in *" $repo "*) continue ;; esac
            for marcador in k8s/argocd infra/terraform; do
              if gh api "repos/$OWNER/$repo/contents/$marcador" >/dev/null 2>&1; then
                DESTINOS="$DESTINOS $repo"
                echo "microsservico: $repo ($marcador)"
                break
              fi
            done
          done
          echo "repos=$DESTINOS" >> "$GITHUB_OUTPUT"

      - name: Propagar
        id: propagar
        env:
          VAL_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          VAL_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          VAL_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -o pipefail
          total=0
          for nome in ${{ steps.destinos.outputs.repos }}; do
            repo="$OWNER/$nome"
            echo "::group::$repo"
            gh secret set AWS_ACCESS_KEY_ID     --repo "$repo" --body "$VAL_ID"
            gh secret set AWS_SECRET_ACCESS_KEY --repo "$repo" --body "$VAL_SECRET"
            gh secret set AWS_SESSION_TOKEN     --repo "$repo" --body "$VAL_TOKEN"
            echo "nivel de repositorio: ok"
            total=$((total + 3))

            for amb in hml prd; do
              if gh api "repos/$repo/environments/$amb" >/dev/null 2>&1; then
                gh secret set AWS_ACCESS_KEY_ID     --repo "$repo" --env "$amb" --body "$VAL_ID"
                gh secret set AWS_SECRET_ACCESS_KEY --repo "$repo" --env "$amb" --body "$VAL_SECRET"
                gh secret set AWS_SESSION_TOKEN     --repo "$repo" --env "$amb" --body "$VAL_TOKEN"
                echo "environment $amb: ok"
                total=$((total + 3))
              else
                echo "environment $amb: nao existe, ignorado"
              fi
            done
            echo "::endgroup::"
          done
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Credenciais AWS"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Conta | \`${{ steps.conta.outputs.conta }}\` |"
            echo "| Repositorios | ${{ steps.destinos.outputs.repos }} |"
            echo "| Secrets gravadas | ${{ steps.propagar.outputs.total || 0 }} |"
            echo "| Resultado | ${{ steps.propagar.outcome }} |"
            echo ""
            if [ "${{ steps.propagar.outcome }}" = "success" ]; then
              echo "As esteiras podem rodar. Refaca esta propagacao a cada sessao nova do"
              echo "laboratorio. Microsservico novo entra sozinho quando tiver k8s/argocd/"
              echo "ou infra/terraform/ na branch padrao."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
