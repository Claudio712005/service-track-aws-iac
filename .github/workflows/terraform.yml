name: Terraform

run-name: "TF ${{ inputs.action }} -> ${{ inputs.env }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acao do Terraform"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
      env:
        description: "Ambiente alvo"
        required: true
        type: choice
        default: hml
        options:
          - hml
          - prd
      lambda_image_tag:
        description: "Tag da imagem da Lambda no ECR"
        required: false
        type: string
        default: latest
      custom_domain:
        description: "Dominio customizado (so PRD). auto = liga se a delegacao NS ja existir"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - "on"
          - "off"

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.env }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prepare:
    name: "1. Preparar (${{ inputs.env }})"
    runs-on: ubuntu-latest
    outputs:
      workdir: ${{ steps.ctx.outputs.workdir }}
      run_url: ${{ steps.ctx.outputs.run_url }}
    steps:
      - name: Resolver contexto
        id: ctx
        run: |
          WORKDIR="iac/environments/${{ inputs.env }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Resumo da execucao
        run: |
          {
            echo "## Terraform — esteira"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Acao | \`${{ inputs.action }}\` |"
            echo "| Ambiente | \`${{ inputs.env }}\` |"
            echo "| Diretorio | \`${{ steps.ctx.outputs.workdir }}\` |"
            echo "| Tag da imagem Lambda | \`${{ inputs.lambda_image_tag }}\` |"
            echo "| Disparado por | @${{ github.actor }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Execucao | [ver run](${{ steps.ctx.outputs.run_url }}) |"
            echo ""
            echo "### Etapas"
            echo "1. Preparar → 2. Validar → 3. Plan → 4. Apply / Destroy"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: "2. Validar"
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        run: terraform -chdir=iac fmt -recursive -check -diff

      - name: terraform init (sem backend)
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} init -backend=false

      - name: terraform validate
        id: validate
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} validate -no-color

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 2. Validar"
            echo "- fmt: ${{ steps.fmt.outcome }}"
            echo "- validate: ${{ steps.validate.outcome }}"
            echo "- [ver job](${{ needs.prepare.outputs.run_url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: "3. Plan (${{ inputs.env }})"
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    env:
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} init

      # Mesma resolucao do job de apply: sem ela o plano de PRD mostraria a
      # destruicao do dominio sempre que ele ja estivesse publicado.
      - name: Resolver dominio customizado
        id: domain
        run: |
          if [ "${{ inputs.env }}" != "prd" ]; then
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          eval "$(bash scripts/dns-zone-state.sh)"
          case "${{ inputs.custom_domain }}" in
            "on")  ENABLE=true ;;
            "off") ENABLE=false ;;
            *)     ENABLE=$DELEGATED ;;
          esac
          echo "enable=$ENABLE" >> "$GITHUB_OUTPUT"

      - name: terraform plan
        id: plan
        run: |
          EXTRA=()
          if [ "${{ inputs.action }}" = "destroy" ]; then EXTRA+=("-destroy"); fi
          if [ "${{ steps.domain.outputs.applicable }}" = "true" ]; then
            EXTRA+=("-var=enable_custom_domain=${{ steps.domain.outputs.enable }}")
          fi
          terraform -chdir=${{ needs.prepare.outputs.workdir }} plan "${EXTRA[@]}" -no-color \
            -var="lambda_image_tag=${{ inputs.lambda_image_tag }}" \
            -out=tfplan.bin | tee plan.txt

      - name: Publicar plano (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}
          path: ${{ needs.prepare.outputs.workdir }}/tfplan.bin
          retention-days: 3

      - name: Resumo do plano
        if: always()
        run: |
          {
            echo "### 3. Plan (\`${{ inputs.action }}\`)"
            echo "- resultado: ${{ steps.plan.outcome }}"
            echo ""
            echo "<details><summary>Ver plano</summary>"
            echo ""
            echo '```'
            tail -c 60000 plan.txt || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: "4. Apply (${{ inputs.env }})"
    needs: [prepare, plan]
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
      url: ${{ steps.outputs.outputs.api_url }}
    env:
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Necessario porque o modulo do authorizer compila o binario Go no apply
      # (null_resource). So faz diferenca quando enable_jwt_authorizer=true, mas
      # o setup e barato e mantem o job correto nos dois casos.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: iac/modules/lambda-authorizer/src/go.sum

      # O bootstrap do ArgoCD (null_resource no stack) aplica o app-of-apps com
      # kubectl no apply. Roda so quando os manifests mudam ou no primeiro apply.
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: terraform init
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} init

      # HML nunca usa dominio proprio (decisao de custo): a variavel nem existe
      # naquele ambiente. Em PRD, `auto` liga o dominio apenas se a delegacao NS
      # ja estiver ativa -- sem ela o ACM pendura ate estourar o timeout.
      - name: Resolver dominio customizado
        id: domain
        run: |
          if [ "${{ inputs.env }}" != "prd" ]; then
            echo "enable=false" >> "$GITHUB_OUTPUT"
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "HML nao usa dominio customizado."
            exit 0
          fi
          echo "applicable=true" >> "$GITHUB_OUTPUT"

          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          eval "$(bash scripts/dns-zone-state.sh)"
          {
            echo "zone=$ZONE_NAME"
            echo "zone_exists=$ZONE_EXISTS"
            echo "delegated=$DELEGATED"
            echo "ns<<EOF"; printf '%s\n' $NAME_SERVERS; echo "EOF"
          } >> "$GITHUB_OUTPUT"

          case "${{ inputs.custom_domain }}" in
            "on")  ENABLE=true ;;
            "off") ENABLE=false ;;
            *)     ENABLE=$DELEGATED ;;
          esac
          echo "enable=$ENABLE" >> "$GITHUB_OUTPUT"
          echo "dominio customizado: $ENABLE (zona=$ZONE_EXISTS delegada=$DELEGATED)"

      - name: Conferir pre-requisitos de rede e banco
        run: |
          ENV="${{ inputs.env }}"
          faltando=0

          if ! aws s3api head-object \
                --bucket servicetrack-tfstate-123124496645 \
                --key "servicetrack/$ENV-network/terraform.tfstate" >/dev/null 2>&1; then
            echo "::error::A rede de $ENV nao foi aplicada."
            echo "::error::Rode antes: Actions -> Network -> apply -> env=$ENV"
            faltando=1
          fi

          if ! aws ssm get-parameter --name "/servicetrack/$ENV/db/endpoint" >/dev/null 2>&1; then
            echo "::error::O banco de $ENV nao foi aplicado."
            echo "::error::Rode antes a esteira Terraform do repositorio service-track-db-infra (env=$ENV)."
            faltando=1
          fi

          [ "$faltando" -eq 0 ] || exit 1
          echo "rede e banco de $ENV presentes."

      - name: Apply fase 1 — ECR
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          terraform -chdir=$WD apply -no-color -auto-approve \
            -target=module.stack.module.ecr_lambda \
            -target=module.stack.module.ecr_app

      - name: Seed da imagem placeholder da Lambda
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          ECR_URL="$(terraform -chdir=$WD output -raw lambda_ecr_repository_url)"
          bash scripts/lambda-bootstrap-image.sh "$ECR_URL" bootstrap

      - name: Apply fase 3 — stack completo
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          EXTRA=()
          if [ "${{ steps.domain.outputs.applicable }}" = "true" ]; then
            EXTRA+=("-var=enable_custom_domain=${{ steps.domain.outputs.enable }}")
          fi
          terraform -chdir=$WD apply -no-color -auto-approve \
            -var="lambda_image_tag=${{ inputs.lambda_image_tag }}" "${EXTRA[@]}"

      - name: Coletar outputs
        id: outputs
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          API_URL="$(terraform -chdir=$WD output -raw api_gateway_url 2>/dev/null || echo '')"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Contract test da API publicada
        id: contract
        env:
          STAGE_NAME: ${{ inputs.env }}
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          BASE="$(terraform -chdir=$WD output -raw api_gateway_url)"
          KEY="$(terraform -chdir=$WD output -json api_key_values | jq -r '.ci')"
          REST_API_ID="$(terraform -chdir=$WD output -raw api_gateway_id)"
          export REST_API_ID
          bash scripts/contract-test.sh "$BASE" "$KEY" | tee contract.txt

      - name: Resumo do apply
        if: always()
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          {
            echo "### 4. Apply concluido — \`${{ inputs.env }}\`"
            echo ""
            echo "| Output | Valor |"
            echo "|---|---|"
            echo "| URL da API | ${{ steps.outputs.outputs.api_url }} |"
            echo "| Contract test | ${{ steps.contract.outcome }} |"
            echo "| Cluster EKS | $(terraform -chdir=$WD output -raw cluster_name 2>/dev/null || echo '-') |"
            echo "| ECR Lambda | $(terraform -chdir=$WD output -raw lambda_ecr_repository_url 2>/dev/null || echo '-') |"
            echo "| RDS | $(terraform -chdir=$WD output -raw rds_endpoint 2>/dev/null || echo '-') |"
            DOMAIN_URL="$(terraform -chdir=$WD output -raw api_custom_domain_url 2>/dev/null || echo '')"
            [ -n "$DOMAIN_URL" ] && echo "| Dominio customizado | $DOMAIN_URL |"
            echo ""
            echo "Chaves de API (uma por consumidor):"
            echo ""
            echo '```bash'
            echo "cd $WD && terraform output -json api_key_values | jq -r .web"
            echo '```'

            if [ "${{ inputs.env }}" = "prd" ] && [ "${{ steps.domain.outputs.enable }}" != "true" ]; then
              echo ""
              echo "---"
              echo ""
              echo "## Acao manual pendente — dominio de PRD"
              echo ""
              echo "PRD subiu no endpoint \`execute-api\`, cuja URL **muda a cada recriacao**."
              echo "Para publicar em dominio proprio falta um passo que nao da para automatizar:"
              echo "o Registro.br nao expoe API para gerenciar a zona."
              echo ""

              if [ "${{ steps.domain.outputs.zone_exists }}" != "true" ]; then
                echo "**1. A hosted zone ainda nao existe.**"
                echo ""
                echo "Rode a esteira **DNS (zona persistente)** com \`action: apply\`."
                echo "Ela imprime os name servers a cadastrar."
              else
                echo "**1. Cadastre estes NS no Registro.br** (uma unica vez):"
                echo ""
                echo "registro.br > Painel > clausilva.com.br > DNS > modo avancado"
                echo ""
                echo "| TIPO | NOME | DADOS |"
                echo "|---|---|---|"
                while read -r ns; do
                  [ -n "$ns" ] && echo "| NS | \`api\` | \`$ns\` |"
                done <<< "${{ steps.domain.outputs.ns }}"
                echo ""
                echo "> Nao delegue o apice: os registros MX/SPF/DKIM de e-mail"
                echo "> continuam no Registro.br e parariam de responder."
                echo ""
                echo "**2. Aguarde a propagacao** e confirme:"
                echo ""
                echo '```bash'
                echo "dig +short NS ${{ steps.domain.outputs.zone }}"
                echo '```'
              fi
              echo ""
              echo "**3. Execute a esteira \`DNS (publicar dominio em PRD)\`.**"
              echo ""
              echo "Depois disso este passo nao se repete: os proximos applies detectam"
              echo "a delegacao sozinhos e mantem o dominio."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: "4. Destroy (${{ inputs.env }})"
    needs: [prepare, plan]
    if: inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    env:
      TF_VAR_datadog_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_datadog_app_key: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Limpar load balancers orfaos
        env:
          CLUSTER_NAME: servicetrack-${{ inputs.env }}
        run: bash scripts/aws-lb-cleanup.sh

      - name: terraform init
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} init

      - name: Baixar plano de destroy
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}
          path: ${{ needs.prepare.outputs.workdir }}

      - name: terraform destroy (aplica plano)
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} apply -no-color tfplan.bin

      - name: Resumo do destroy
        if: always()
        run: |
          {
            echo "### 4. Destroy — \`${{ inputs.env }}\`"
            echo "- ambiente destruido."
          } >> "$GITHUB_STEP_SUMMARY"
