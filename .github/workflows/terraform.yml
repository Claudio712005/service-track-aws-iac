name: Terraform

run-name: "TF ${{ inputs.action }} ${{ inputs.camada }} -> ${{ inputs.env }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acao do Terraform"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
      env:
        description: "Ambiente alvo"
        required: true
        type: choice
        default: hml
        options:
          - hml
          - prd
      camada:
        description: "Camada da infraestrutura"
        required: true
        type: choice
        default: stack
        options:
          - rede
          - stack
      expor_argocd:
        description: "Expor o ArgoCD por LoadBalancer (so vale na camada stack)"
        required: false
        type: choice
        default: padrao
        options:
          - padrao
          - sim
          - nao
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      env:
        required: true
        type: string
      camada:
        required: true
        type: string
      expor_argocd:
        required: false
        type: string
        default: padrao

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.camada }}-${{ inputs.env }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prepare:
    name: "1. Preparar (${{ inputs.env }})"
    runs-on: ubuntu-latest
    outputs:
      workdir: ${{ steps.ctx.outputs.workdir }}
      run_url: ${{ steps.ctx.outputs.run_url }}
    steps:
      - name: Resolver contexto
        id: ctx
        env:
          ENV_ALVO: ${{ inputs.env }}
        run: |
          WORKDIR="iac/environments/$ENV_ALVO"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Resumo da execucao
        env:
          ACAO: ${{ inputs.action }}
          CAMADA: ${{ inputs.camada }}
          ENV_ALVO: ${{ inputs.env }}
        run: |
          {
            echo "## Terraform — esteira"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Acao | \`$ACAO\` |"
            echo "| Ambiente | \`$ENV_ALVO\` |"
            echo "| Diretorio | \`${{ steps.ctx.outputs.workdir }}\` |"
            echo "| Camada | \`$CAMADA\` |"
            echo "| Disparado por | @${{ github.actor }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Execucao | [ver run](${{ steps.ctx.outputs.run_url }}) |"
            echo ""
            echo "### Etapas"
            echo "1. Preparar → 2. Validar → 3. Plan → 4. Apply / Destroy"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: "2. Validar"
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        id: fmt
        run: terraform -chdir=iac fmt -recursive -check -diff

      - name: terraform init (sem backend)
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} init -backend=false

      - name: terraform validate
        id: validate
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} validate -no-color

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 2. Validar"
            echo "- fmt: ${{ steps.fmt.outcome }}"
            echo "- validate: ${{ steps.validate.outcome }}"
            echo "- [ver job](${{ needs.prepare.outputs.run_url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  rede:
    name: "3. Rede"
    needs: [prepare, validate]
    if: inputs.camada == 'rede'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    defaults:
      run:
        working-directory: iac/network/${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Garantir o bucket de state
        working-directory: ${{ github.workspace }}
        run: bash scripts/bootstrap-tfstate.sh

      - name: Conferir que o banco ja foi destruido
        if: inputs.action == 'destroy'
        env:
          ENV_ALVO: ${{ inputs.env }}
        run: |
          if aws ssm get-parameter --name "/servicetrack/$ENV_ALVO/db/endpoint" >/dev/null 2>&1; then
            echo "::error::O banco de $ENV_ALVO ainda existe e vive dentro desta rede."
            echo "::error::Destrua antes pela esteira Terraform do service-track-db-infra (env=$ENV_ALVO)."
            exit 1
          fi
          echo "banco de $ENV_ALVO ausente, rede pode ser destruida."

      - name: terraform init
        run: terraform init -input=false -backend-config="bucket=$BUCKET_DE_STATE"

      - name: terraform plan
        if: inputs.action != 'apply'
        env:
          ACAO: ${{ inputs.action }}
        run: |
          EXTRA=()
          if [ "$ACAO" = "destroy" ]; then EXTRA+=("-destroy"); fi
          terraform plan "${EXTRA[@]}" -no-color -lock-timeout=10m -out=tfplan.bin

      - name: terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -no-color -auto-approve -lock-timeout=10m

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: terraform apply -no-color -lock-timeout=10m tfplan.bin

      - name: Resumo
        if: always()
        env:
          ACAO: ${{ inputs.action }}
          ENV_ALVO: ${{ inputs.env }}
        run: |
          {
            echo "### Rede de $ENV_ALVO"
            echo ""
            echo "Operacao: **$ACAO** · Resultado: **${{ job.status }}**"
            echo ""
            echo "A rede vive em state proprio (\`servicetrack/$ENV_ALVO-network\`)"
            echo "porque o banco e o stack a consomem por remote state."
          } >> "$GITHUB_STEP_SUMMARY"

  executar:
    name: "3. Stack"
    if: inputs.camada == 'stack'
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Garantir o bucket de state
        run: bash scripts/bootstrap-tfstate.sh

      - name: terraform init
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} init -input=false -backend-config="bucket=$BUCKET_DE_STATE"

      - name: Ler as flags do ambiente
        id: flags
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          ERRO="$(mktemp)"

          ler() {
            printf 'var.%s\n' "$1" \
              | terraform -chdir="$WD" console -no-color 2>"$ERRO" \
              | tr -d '"' \
              | grep -Ex 'true|false' \
              | tail -n 1
          }

          AUTH="$(ler habilitar_autenticacao || true)"
          BORDA="$(ler habilitar_borda || true)"
          for v in AUTH BORDA; do
            case "${!v}" in
              true|false) ;;
              *)
                echo "::error::Nao consegui ler as flags do ambiente com 'terraform console'."
                echo "::error::Valor lido para $v: '${!v}'"
                echo "::error::Saida de erro do console:"
                sed 's/^/::error::  /' "$ERRO"
                exit 1
                ;;
            esac
          done
          echo "auth=$AUTH" >> "$GITHUB_OUTPUT"
          echo "borda=$BORDA" >> "$GITHUB_OUTPUT"
          echo "autenticacao=$AUTH borda=$BORDA"

      - name: Conferir pre-requisitos
        if: inputs.action != 'destroy'
        env:
          ENV_ALVO: ${{ inputs.env }}
        run: |
          ENV="$ENV_ALVO"
          faltando=0

          if ! aws s3api head-object \
                --bucket "$BUCKET_DE_STATE" \
                --key "servicetrack/$ENV-network/terraform.tfstate" >/dev/null 2>&1; then
            echo "::error::A rede de $ENV nao foi aplicada."
            echo "::error::Rode antes: Actions -> Terraform -> apply, camada=rede, env=$ENV"
            faltando=1
          fi

          if [ "${{ steps.flags.outputs.auth }}" = "true" ] \
             && ! aws ssm get-parameter --name "/servicetrack/$ENV/db/endpoint" >/dev/null 2>&1; then
            echo "::error::habilitar_autenticacao = true exige o banco de $ENV aplicado."
            echo "::error::Rode antes a esteira Terraform do repositorio service-track-db-infra (env=$ENV)."
            faltando=1
          fi

          [ "$faltando" -eq 0 ] || exit 1
          echo "pre-requisitos de $ENV presentes."

      - name: Limpar load balancers orfaos
        if: inputs.action == 'destroy'
        env:
          CLUSTER_NAME: servicetrack-${{ inputs.env }}
        run: bash scripts/aws-lb-cleanup.sh

      - name: Definir a exposicao do ArgoCD
        id: argocd
        env:
          ESCOLHA: ${{ inputs.expor_argocd }}
        run: |
          case "$ESCOLHA" in
            sim) VAR="-var=argocd_expose_lb=true" ;;
            nao) VAR="-var=argocd_expose_lb=false" ;;
            padrao|"") VAR="" ;;
            *)
              echo "::error::expor_argocd aceita padrao, sim ou nao. Recebido: '$ESCOLHA'"
              exit 1
              ;;
          esac
          echo "var=$VAR" >> "$GITHUB_OUTPUT"
          if [ -n "$VAR" ]; then
            echo "exposicao do ArgoCD nesta execucao: $ESCOLHA"
          else
            echo "exposicao do ArgoCD: padrao do ambiente"
          fi

      - name: terraform plan
        id: plan
        if: inputs.action != 'apply'
        env:
          ACAO: ${{ inputs.action }}
          VAR_ARGOCD: ${{ steps.argocd.outputs.var }}
        run: |
          EXTRA=()
          if [ "$ACAO" = "destroy" ]; then EXTRA+=("-destroy"); fi
          if [ -n "$VAR_ARGOCD" ]; then EXTRA+=("$VAR_ARGOCD"); fi
          terraform -chdir=${{ needs.prepare.outputs.workdir }} plan "${EXTRA[@]}" -no-color -lock-timeout=10m \
            -out=tfplan.bin | tee plan.txt
          exit "${PIPESTATUS[0]}"

      - name: Publicar plano (artefato)
        if: inputs.action != 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.env }}-${{ github.run_id }}
          path: ${{ needs.prepare.outputs.workdir }}/tfplan.bin
          retention-days: 5

      - name: Apply fase 1 — ECR da Lambda
        if: inputs.action == 'apply' && steps.flags.outputs.auth == 'true'
        env:
          VAR_ARGOCD: ${{ steps.argocd.outputs.var }}
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          EXTRA=()
          if [ -n "$VAR_ARGOCD" ]; then EXTRA+=("$VAR_ARGOCD"); fi
          terraform -chdir=$WD apply "${EXTRA[@]}" -no-color -auto-approve -lock-timeout=10m \
            -target=module.stack.module.ecr_lambda

      - name: Seed da imagem placeholder da Lambda
        if: inputs.action == 'apply' && steps.flags.outputs.auth == 'true'
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          ECR_URL="$(terraform -chdir=$WD output -raw lambda_ecr_repository_url)"
          bash scripts/lambda-bootstrap-image.sh "$ECR_URL" bootstrap

      - name: Apply fase 3 — stack completo
        if: inputs.action == 'apply'
        env:
          VAR_ARGOCD: ${{ steps.argocd.outputs.var }}
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          EXTRA=()
          if [ -n "$VAR_ARGOCD" ]; then EXTRA+=("$VAR_ARGOCD"); fi
          terraform -chdir=$WD apply "${EXTRA[@]}" -no-color -auto-approve -lock-timeout=10m

      - name: terraform destroy (aplica plano)
        if: inputs.action == 'destroy'
        run: terraform -chdir=${{ needs.prepare.outputs.workdir }} apply -no-color -lock-timeout=10m tfplan.bin

      - name: Descobrir o endereco do ArgoCD
        if: inputs.action == 'apply'
        env:
          ENV_ALVO: ${{ inputs.env }}
        run: |
          aws eks update-kubeconfig --name "servicetrack-$ENV_ALVO" --region "$AWS_REGION" >/dev/null

          TIPO="$(kubectl -n argocd get svc argocd-server -o jsonpath='{.spec.type}' 2>/dev/null || echo desconhecido)"
          echo "ARGOCD_TIPO_DE_SERVICE=$TIPO" >> "$GITHUB_ENV"
          echo "service do argocd-server: $TIPO"

          if [ "$TIPO" != "LoadBalancer" ]; then
            exit 0
          fi

          for _ in $(seq 1 18); do
            HOST="$(kubectl -n argocd get svc argocd-server \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo '')"
            if [ -n "$HOST" ]; then
              echo "ARGOCD_ENDERECO=http://$HOST" >> "$GITHUB_ENV"
              echo "endereco do ArgoCD: http://$HOST"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::O LoadBalancer do ArgoCD foi criado mas ainda nao tem endereco depois de 3 minutos."

      - name: Coletar outputs
        id: outputs
        if: inputs.action == 'apply' && steps.flags.outputs.borda == 'true'
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          API_URL="$(terraform -chdir=$WD output -raw api_gateway_url 2>/dev/null || echo '')"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Contract test da API publicada
        id: contract
        if: inputs.action == 'apply' && steps.flags.outputs.borda == 'true'
        env:
          STAGE_NAME: ${{ inputs.env }}
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          BASE="$(terraform -chdir=$WD output -raw api_gateway_url)"
          KEY="$(terraform -chdir=$WD output -json api_key_values | jq -r '.ci')"
          REST_API_ID="$(terraform -chdir=$WD output -raw api_gateway_id)"
          export REST_API_ID
          set -o pipefail
          bash scripts/contract-test.sh "$BASE" "$KEY" | tee contract.txt

      - name: Resumo do plano
        if: always() && inputs.action == 'plan'
        env:
          ACAO: ${{ inputs.action }}
        run: |
          {
            echo "### 3. Plan (\`$ACAO\`)"
            echo "- resultado: ${{ steps.plan.outcome }}"
            echo ""
            echo "<details><summary>Ver plano</summary>"
            echo ""
            echo '```'
            tail -c 60000 plan.txt || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do apply
        if: always() && inputs.action == 'apply'
        env:
          ENV_ALVO: ${{ inputs.env }}
        run: |
          WD="${{ needs.prepare.outputs.workdir }}"
          {
            echo "### 4. Apply concluido — \`$ENV_ALVO\`"
            echo ""
            echo "| Output | Valor |"
            echo "|---|---|"
            echo "| Cluster EKS | $(terraform -chdir=$WD output -raw cluster_name 2>/dev/null || echo '-') |"
            echo "| Autenticacao | ${{ steps.flags.outputs.auth }} |"
            echo "| Borda (API Gateway) | ${{ steps.flags.outputs.borda }} |"
            echo "| URL da API | ${{ steps.outputs.outputs.api_url || '-' }} |"
            echo "| Contract test | ${{ steps.contract.outcome || 'ignorado' }} |"
            echo "| ECR Lambda | $(terraform -chdir=$WD output -raw lambda_ecr_repository_url 2>/dev/null || echo '-') |"
            echo "| Lambda de autenticacao | $(terraform -chdir=$WD output -raw lambda_function_name 2>/dev/null || echo '-') |"
            ARGO_URL="$(terraform -chdir=$WD output -raw argocd_url 2>/dev/null || echo '')"
            if [ -z "$ARGO_URL" ]; then ARGO_URL="${ARGOCD_ENDERECO:-}"; fi
            if [ -n "$ARGO_URL" ]; then
              echo "| ArgoCD | $ARGO_URL |"
            elif [ "${ARGOCD_TIPO_DE_SERVICE:-}" = "LoadBalancer" ]; then
              echo "| ArgoCD | LoadBalancer criado, endereco ainda provisionando: \`kubectl -n argocd get svc argocd-server\` |"
            else
              echo "| ArgoCD | sem LoadBalancer neste ambiente, use port-forward |"
            fi
            echo ""
            if [ "${{ steps.flags.outputs.borda }}" = "true" ]; then
              echo ""
              echo "Chave de API (muda a cada recriacao, nao e impressa aqui porque"
              echo "este repositorio e publico):"
              echo ""
              echo '```bash'
              echo "scripts/diagnostico/chave-de-api.sh $ENV_ALVO"
              echo '```'
            else
              echo ""
              echo "Sem borda neste ambiente: os microsservicos so respondem dentro do"
              echo "cluster. Para alcancar um deles do seu terminal, use port-forward."
            fi
            echo ""
            echo "Acesso ao cluster e ao ArgoCD:"
            echo ""
            echo '```bash'
            terraform -chdir=$WD output -raw configure_kubectl 2>/dev/null || true
            echo ""
            terraform -chdir=$WD output -raw argocd_admin_password_cmd 2>/dev/null || true
            echo ""
            if [ -z "$ARGO_URL" ]; then
              echo "kubectl -n argocd port-forward svc/argocd-server 8081:80"
            fi
            echo '```'
            echo ""
            echo "Pods dos microsservicos descobertos:"
            echo ""
            echo '```bash'
            echo "kubectl get pods -A -l app.kubernetes.io/part-of=service-track"
            echo "kubectl -n argocd get applications"
            echo '```'

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do destroy
        if: always() && inputs.action == 'destroy'
        env:
          ENV_ALVO: ${{ inputs.env }}
        run: |
          {
            echo "### 4. Destroy — \`$ENV_ALVO\`"
            echo "- ambiente destruido."
          } >> "$GITHUB_STEP_SUMMARY"
