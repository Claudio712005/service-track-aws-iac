name: Destruir ambiente

run-name: "Destruir ${{ inputs.env }} (${{ inputs.escopo }}) por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Ambiente alvo"
        required: true
        type: choice
        options: [hml, prd]
        default: hml
      escopo:
        description: "O que destruir. 'tudo' exige o banco ja destruido pelo service-track-db-infra"
        required: true
        type: choice
        options:
          - so-o-stack
          - tudo
        default: so-o-stack
      confirmo:
        description: "Digite o nome do ambiente para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orquestracao-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  confirmar:
    name: "0. Confirmar a intencao"
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o nome digitado
        run: |
          if [ "${{ inputs.confirmo }}" != "${{ inputs.env }}" ]; then
            echo "::error::Digite '${{ inputs.env }}' no campo de confirmacao."
            exit 1
          fi
          echo "confirmado: ${{ inputs.env }} / ${{ inputs.escopo }}"

  stack:
    name: "1. Stack"
    needs: confirmar
    uses: ./.github/workflows/terraform.yml
    with:
      action: destroy
      env: ${{ inputs.env }}
      camada: stack
    secrets: inherit

  rede:
    name: "2. Rede"
    needs: stack
    if: inputs.escopo == 'tudo'
    uses: ./.github/workflows/terraform.yml
    with:
      action: destroy
      env: ${{ inputs.env }}
      camada: rede
    secrets: inherit

  resumo:
    name: "Resumo"
    needs: [stack, rede]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        run: |
          {
            echo "### Destruicao de \`${{ inputs.env }}\`"
            echo ""
            echo "Escopo: **${{ inputs.escopo }}**"
            echo ""
            echo "| Fase | Resultado |"
            echo "|---|---|"
            echo "| 1. Stack | ${{ needs.stack.result }} |"
            echo "| 2. Rede | ${{ needs.rede.result }} |"
            echo ""
            if [ "${{ inputs.escopo }}" = "so-o-stack" ]; then
              echo "Rede e banco continuam de pe. Para retomar, rode **Subir ambiente**."
            else
              echo "O bucket de state nao e destruido: ele guarda o historico de todos"
              echo "os ambientes e e pre-requisito da proxima criacao."
            fi
            echo ""
            echo "Recursos que vivem fora deste repositorio nao foram tocados: banco"
            echo "(\`service-track-db-infra\`) e a infraestrutura de cada microsservico"
            echo "(\`infra/terraform\` do proprio repositorio)."
          } >> "$GITHUB_STEP_SUMMARY"
