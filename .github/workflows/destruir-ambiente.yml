name: Destruir ambiente

run-name: "Destruir ${{ inputs.env }} (${{ inputs.escopo }}) por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Ambiente alvo"
        required: true
        type: choice
        options: [hml, prd]
        default: hml
      escopo:
        description: "O que destruir"
        required: true
        type: choice
        options:
          - so-o-stack
          - tudo
        default: so-o-stack
      confirmo:
        description: "Digite o nome do ambiente para confirmar"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orquestracao-${{ inputs.env }}
  cancel-in-progress: false

env:
  IAC: Claudio712005/service-track-aws-iac
  DB: Claudio712005/service-track-db-infra

jobs:
  confirmar:
    name: "0. Confirmar a intencao"
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o nome digitado
        run: |
          if [ "${{ inputs.confirmo }}" != "${{ inputs.env }}" ]; then
            echo "::error::Digite '${{ inputs.env }}' no campo de confirmacao."
            exit 1
          fi
          echo "confirmado: ${{ inputs.env }} / ${{ inputs.escopo }}"

  stack:
    name: "1. Stack"
    needs: confirmar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$IAC" terraform.yml \
            -f action=destroy -f env="${{ inputs.env }}" -f camada=stack

  banco:
    name: "2. Banco"
    needs: stack
    if: inputs.escopo == 'tudo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$DB" terraform.yml \
            -f action=destroy -f env="${{ inputs.env }}"

  rede:
    name: "3. Rede"
    needs: banco
    if: inputs.escopo == 'tudo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$IAC" terraform.yml \
            -f action=destroy -f env="${{ inputs.env }}" -f camada=rede

  resumo:
    name: "Resumo"
    needs: [stack, banco, rede]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        run: |
          {
            echo "### Destruicao de \`${{ inputs.env }}\`"
            echo ""
            echo "Escopo: **${{ inputs.escopo }}**"
            echo ""
            echo "| Fase | Resultado |"
            echo "|---|---|"
            echo "| 1. Stack | ${{ needs.stack.result }} |"
            echo "| 2. Banco | ${{ needs.banco.result }} |"
            echo "| 3. Rede | ${{ needs.rede.result }} |"
            echo ""
            if [ "${{ inputs.escopo }}" = "so-o-stack" ]; then
              echo "Rede e banco continuam de pe. Para retomar, rode **Subir ambiente**"
              echo "com \`primeira_subida: true\` — as fases 1 e 2 sao idempotentes e"
              echo "passam em segundos."
            else
              echo "O bucket de state nao e destruido: ele guarda o historico de todos"
              echo "os ambientes e e pre-requisito da proxima criacao."
              echo ""
              echo "A hosted zone do Route53 vive em state separado e nao foi tocada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
