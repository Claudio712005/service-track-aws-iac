name: Deploy image (bump)

run-name: "Bump ${{ github.event.client_payload.environment || inputs.environment }} -> ${{ github.event.client_payload.image_tag || inputs.image_tag }}"

on:
  repository_dispatch:
    types: [image-published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo"
        required: true
        type: choice
        options:
          - hml
          - prd
      image_tag:
        description: "Tag da imagem publicada no ECR (SHA do commit)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-image-${{ github.event.client_payload.environment || inputs.environment }}
  cancel-in-progress: false

jobs:
  bump:
    name: "1. Bump da imagem"
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.in.outputs.environment }}
      image_tag: ${{ steps.in.outputs.image_tag }}
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolver entradas
        id: in
        run: |
          ENVIRONMENT="${{ github.event.client_payload.environment || inputs.environment }}"
          IMAGE_TAG="${{ github.event.client_payload.image_tag || inputs.image_tag }}"

          case "$ENVIRONMENT" in
            hml|prd) ;;
            *) echo "::error::environment invalido: '$ENVIRONMENT' (use hml ou prd)"; exit 1 ;;
          esac
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
            echo "::error::image_tag invalida: '$IMAGE_TAG'"; exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "file=kubernetes/k8s/overlays/$ENVIRONMENT/kustomization.yaml" >> "$GITHUB_OUTPUT"

      - name: Atualizar a tag
        id: bump
        run: |
          FILE="${{ steps.in.outputs.file }}"
          TAG="${{ steps.in.outputs.image_tag }}"
          CURRENT="$(grep -E '^  newTag:' "$FILE" | awk '{print $2}')"
          if [ "$CURRENT" = "$TAG" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag ja e $TAG; nada a fazer."
            exit 0
          fi
          sed -i -E "s|^  newTag: .*|  newTag: $TAG|" "$FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "previous=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Commit e push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "servicetrack-ci"
          git config user.email "ci@servicetrack.local"
          git add "${{ steps.in.outputs.file }}"
          git commit -m "deploy(${{ steps.in.outputs.environment }}): imagem ${{ steps.in.outputs.image_tag }}"
          git push origin main

      - name: Resumo do bump
        if: always()
        run: |
          {
            echo "## Deploy image — ${{ steps.in.outputs.environment }}"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Ambiente | \`${{ steps.in.outputs.environment }}\` |"
            echo "| Tag | \`${{ steps.in.outputs.image_tag }}\` |"
            echo "| Alterado | ${{ steps.bump.outputs.changed }} |"
            echo "| Tag anterior | \`${{ steps.bump.outputs.previous }}\` |"
            echo ""
            if [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
              echo "Commit feito em main. A confirmacao do rollout roda no job seguinte."
            else
              echo "Sem mudanca de tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  confirmar:
    name: "2. Confirmar o rollout"
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.bump.outputs.environment }}
    env:
      AMBIENTE: ${{ needs.bump.outputs.environment }}
      TAG: ${{ needs.bump.outputs.image_tag }}
      NAMESPACE: service-track
      DEPLOYMENT: service-track-app
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Conectar ao cluster
        run: |
          aws eks update-kubeconfig --name "servicetrack-$AMBIENTE" --region us-east-1
          kubectl version --client=true -o yaml > /dev/null

      - name: Esperar o ArgoCD propagar a tag
        id: propagacao
        run: |
          echo "esperando o deployment referenciar a tag $TAG"
          LIMITE=$(( SECONDS + 480 ))
          while [ "$SECONDS" -lt "$LIMITE" ]; do
            ATUAL="$(kubectl -n "$NAMESPACE" get deployment "$DEPLOYMENT" \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            case "$ATUAL" in
              *":$TAG") echo "tag propagada: $ATUAL"; exit 0 ;;
            esac
            echo "  ainda em: ${ATUAL:-<deployment ausente>}"
            sleep 20
          done
          echo "::error::O ArgoCD nao propagou a tag $TAG em 8 minutos."
          echo "::error::Confira a Application no ArgoCD: pode estar OutOfSync ou com erro de sync."
          exit 1

      - name: Aguardar o rollout concluir
        run: |
          if ! kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=300s; then
            echo "::error::O rollout nao concluiu. Estado dos pods:"
            kubectl -n "$NAMESPACE" get pods -l app=service-track-app -o wide || true
            kubectl -n "$NAMESPACE" describe deployment "$DEPLOYMENT" | tail -30 || true
            exit 1
          fi

      - name: Resumo do rollout
        if: always()
        run: |
          {
            echo "## Rollout — $AMBIENTE"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Tag entregue | \`$TAG\` |"
            echo "| Deployment | \`$NAMESPACE/$DEPLOYMENT\` |"
            echo "| Resultado | ${{ job.status }} |"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "A imagem esta rodando no cluster. Este job e a evidencia de que o"
              echo "deploy automatico chegou ao fim, e nao apenas foi disparado."
            else
              echo "O deploy foi disparado mas nao chegou ao fim. Ver os logs acima."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
