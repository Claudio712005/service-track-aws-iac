name: Subir ambiente

run-name: "Subir ${{ inputs.env }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Ambiente alvo"
        required: true
        type: choice
        options: [hml, prd]
        default: hml

permissions:
  contents: read

concurrency:
  group: orquestracao-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  rede:
    name: "1. Rede"
    uses: ./.github/workflows/terraform.yml
    with:
      action: apply
      env: ${{ inputs.env }}
      camada: rede
    secrets: inherit

  stack:
    name: "2. Stack"
    needs: rede
    uses: ./.github/workflows/terraform.yml
    with:
      action: apply
      env: ${{ inputs.env }}
      camada: stack
    secrets: inherit

  resumo:
    name: "Resumo"
    needs: [rede, stack]
    if: always()
    runs-on: ubuntu-latest
    env:
      ENV_ALVO: ${{ inputs.env }}
    environment:
      name: ${{ inputs.env }}
    steps:
      - name: Configurar credenciais AWS
        if: needs.stack.result == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Ler os enderecos do ambiente
        id: enderecos
        if: needs.stack.result == 'success'
        run: |
          URL="$(aws ssm get-parameter --name "/servicetrack/$ENV_ALVO/api/base-url" \
            --query Parameter.Value --output text 2>/dev/null || echo '')"
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Consolidar
        run: |
          {
            echo "### Subida de \`$ENV_ALVO\`"
            echo ""
            echo "| Fase | Resultado |"
            echo "|---|---|"
            echo "| 1. Rede | ${{ needs.rede.result }} |"
            echo "| 2. Stack | ${{ needs.stack.result }} |"
            echo ""
            if [ "${{ needs.stack.result }}" = "success" ]; then
              echo "### Plataforma de pe"
              echo ""
              URL="${{ steps.enderecos.outputs.api_url }}"
              if [ -n "$URL" ]; then
                echo "API: $URL"
                echo ""
                echo "A chave de API muda a cada recriacao. Para ler:"
                echo ""
                echo '```bash'
                echo "scripts/diagnostico/chave-de-api.sh $ENV_ALVO"
                echo '```'
              else
                echo "Sem borda publica neste ambiente (habilitar_borda = false)."
                echo "Os microsservicos so respondem dentro do cluster."
              fi
              echo ""
              echo "### Ver os microsservicos"
              echo ""
              echo '```bash'
              echo "aws eks update-kubeconfig --name servicetrack-$ENV_ALVO --region us-east-1"
              echo "kubectl get pods -A -l app.kubernetes.io/part-of=service-track"
              echo "kubectl -n argocd get applications"
              echo '```'
              echo ""
              echo "### Proximos passos, cada um no proprio repositorio"
              echo ""
              echo "- **Microsservicos** com \`k8s/argocd/$ENV_ALVO.yaml\` na \`main\` ja foram"
              echo "  registrados no ArgoCD. Cada um precisa da propria infra aplicada"
              echo "  (\`infra/terraform\`) e de uma imagem publicada no proprio ECR."
            else
              echo "A sequencia parou na primeira falha. Reexecute pelo botao de re-run do"
              echo "GitHub — as fases concluidas sao idempotentes."
              echo ""
              echo "Com habilitar_autenticacao = true, o stack ainda exige o banco de"
              echo "\`$ENV_ALVO\` aplicado pelo \`service-track-db-infra\`, depois da rede."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
