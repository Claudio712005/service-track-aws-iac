name: Subir ambiente

run-name: "Subir ${{ inputs.env }} por @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Ambiente alvo"
        required: true
        type: choice
        options: [hml, prd]
        default: hml
      primeira_subida:
        description: "Ambiente novo: usa a tag bootstrap na Lambda"
        required: false
        type: boolean
        default: false
      incluir_aplicacao:
        description: "Publicar tambem a Lambda e a aplicacao"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: orquestracao-${{ inputs.env }}
  cancel-in-progress: false

env:
  IAC: Claudio712005/service-track-aws-iac
  DB: Claudio712005/service-track-db-infra
  LAMBDA: Claudio712005/service-track-lambda
  API: Claudio712005/service-track-api

jobs:
  rede:
    name: "1. Rede"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$IAC" terraform.yml \
            -f action=apply -f env="${{ inputs.env }}" -f camada=rede

  banco:
    name: "2. Banco"
    needs: rede
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$DB" terraform.yml \
            -f action=apply -f env="${{ inputs.env }}"

  stack:
    name: "3. Stack"
    needs: banco
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG=latest
          if [ "${{ inputs.primeira_subida }}" = "true" ]; then TAG=bootstrap; fi
          bash scripts/disparar-workflow.sh "$IAC" terraform.yml \
            -f action=apply -f env="${{ inputs.env }}" -f camada=stack \
            -f lambda_image_tag="$TAG"

  lambda:
    name: "4. Lambda"
    needs: stack
    if: inputs.incluir_aplicacao
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$LAMBDA" cd.yml \
            -f env="${{ inputs.env }}"

  aplicacao:
    name: "5. Aplicacao"
    needs: lambda
    if: inputs.incluir_aplicacao
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/disparar-workflow.sh "$API" cd-app.yml \
            -f env="${{ inputs.env }}"

  resumo:
    name: "Resumo"
    needs: [rede, banco, stack, lambda, aplicacao]
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.env }}
    steps:
      - name: Configurar credenciais AWS
        if: needs.stack.result == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Ler os enderecos do ambiente
        id: enderecos
        if: needs.stack.result == 'success'
        run: |
          URL="$(aws ssm get-parameter --name "/servicetrack/${{ inputs.env }}/api/base-url" \
            --query Parameter.Value --output text 2>/dev/null || echo '')"
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Consolidar
        run: |
          {
            echo "### Subida de \`${{ inputs.env }}\`"
            echo ""
            echo "| Fase | Resultado |"
            echo "|---|---|"
            echo "| 1. Rede | ${{ needs.rede.result }} |"
            echo "| 2. Banco | ${{ needs.banco.result }} |"
            echo "| 3. Stack | ${{ needs.stack.result }} |"
            echo "| 4. Lambda | ${{ needs.lambda.result }} |"
            echo "| 5. Aplicacao | ${{ needs.aplicacao.result }} |"
            echo ""
            if [ "${{ needs.aplicacao.result }}" = "success" ]; then
              echo "### Ambiente de pe"
              echo ""
              URL="${{ steps.enderecos.outputs.api_url }}"
              if [ -n "$URL" ]; then
                echo "| Endereco | Valor |"
                echo "|---|---|"
                echo "| API | $URL |"
                echo "| Login | \`POST $URL/autenticacao\` |"
                echo ""
                echo "A chave de API muda a cada recriacao. Para ler:"
                echo ""
                echo '```bash'
                echo "cd iac/environments/${{ inputs.env }}"
                echo "terraform output -json api_key_values | jq -r .web"
                echo '```'
                echo ""
                echo "Teste rapido, trocando CHAVE pelo valor acima:"
                echo ""
                echo '```bash'
                echo "curl -s -X POST \"$URL/autenticacao\" \\"
                echo "  -H 'x-api-key: CHAVE' -H 'Content-Type: application/json' \\"
                echo "  -d '{\"cpf\":\"13646633093\",\"senha\":\"SENHA_DO_SEED\"}'"
                echo '```'
              else
                echo "Nao consegui ler a URL do SSM. Ela esta no resumo da fase 3."
              fi
              echo ""
              echo "Demais enderecos (ArgoCD, RDS, ECR) no resumo da fase 3."
            else
              echo "A sequencia parou na primeira falha. Cada fase e um job: reexecute"
              echo "apenas a que falhou pelo botao de re-run do GitHub, ou rode tudo de"
              echo "novo — as fases concluidas sao idempotentes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
